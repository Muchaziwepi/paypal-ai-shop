services:
  - type: web
    name: paypal-ai-shop
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
